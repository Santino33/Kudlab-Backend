openapi: 3.1.0
info:
  title: Kudlab - Gestión de cuentas y roles
  version: 0.1.0
  description: >-
    Contrato propuesto para el módulo Usuarios (RF-001 V3, pendiente de
    validación institucional). Son rutas nuevas de negocio; no están
    documentadas como endpoints existentes en las fuentes originales.
servers:
  - url: /
tags:
  - name: Cuentas
    description: Solo administrador activo con permiso vigente.
  - name: Invitaciones
    description: Canje por titular del correo, sin sesión previa.
security:
  - sessionCookie: []
  - sessionBearer: []
paths:
  /api/v1/accounts:
    get:
      tags: [Cuentas]
      summary: Listar cuentas de personal
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/AccountStatus' }
      responses:
        '200':
          description: Resultado paginado sin credenciales ni datos de menores.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
                  total: { type: integer, minimum: 0 }
                  limit: { type: integer, minimum: 1 }
                  offset: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Cuentas]
      summary: Crear cuenta pendiente y solicitar invitación
      description: >-
        Alta ordinaria únicamente TEACHER con correo .edu.co. No crea aún
        usuario Better Auth ni contraseña. La invitación dura siete días;
        no comunicar ENVIADA hasta confirmar el proveedor. ADMIN inicial
        se crea por bootstrap al primer arranque, nunca mediante esta ruta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccount' }
      responses:
        '201':
          description: Cuenta PENDIENTE; invitación registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Cuentas]
      summary: Consultar cuenta
      responses:
        '200':
          description: Cuenta encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Cuentas]
      summary: Editar nombre y/o correo institucional
      description: >-
        Cambiar correo de cuenta PENDIENTE invalida la invitación anterior;
        cambiar el de cuenta ACTIVA exige verificar el correo nuevo antes de
        que pueda emplearse para acceso. Reenviar el mismo correo de una
        cuenta PENDIENTE invalida el enlace previo y emite uno nuevo (útil
        para recuperar una entrega fallida). No modifica rol ni estado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1 }
                email:
                  type: string
                  format: email
                  pattern: '^[^@\s]+@(?:[A-Za-z0-9-]+\.)+[eE][dD][uU]\.[cC][oO]$'
      responses:
        '200':
          description: Datos editables actualizados o verificación iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/accounts/{id}/role:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    put:
      tags: [Cuentas]
      summary: Sustituir ADMIN por TEACHER
      description: >-
        Un cambio directo solo puede retirar el rol ADMIN; no permite
        ascender TEACHER a ADMIN. Ese ascenso ocurre exclusivamente tras
        aprobar una solicitud del titular. Degradar al último ADMIN activo
        devuelve 409 sin cambios.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { type: string, const: TEACHER }
      responses:
        '200':
          description: Rol actual y permisos efectivos actualizados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin-role-requests:
    get:
      tags: [Cuentas]
      summary: Consultar solicitudes de ascenso
      description: TEACHER solo ve las propias; ADMIN ve las pendientes para decidir.
      responses:
        '200':
          description: Solicitudes visibles para el actor.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminRoleRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Cuentas]
      summary: Solicitar rol Administrador para la propia cuenta TEACHER
      description: No otorga permisos mientras se encuentra pendiente.
      responses:
        '201':
          description: Solicitud registrada sin cambiar el rol actual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRoleRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin-role-requests/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Cuentas]
      summary: Aprobar ascenso pendiente como ADMIN distinto del solicitante
      responses:
        '200':
          description: Solicitud APROBADA y rol del titular cambiado a ADMIN.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRoleRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/admin-role-requests/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Cuentas]
      summary: Rechazar ascenso pendiente sin alterar rol del solicitante
      responses:
        '200':
          description: Solicitud RECHAZADA; el titular conserva TEACHER.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRoleRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/account-email-changes/confirm:
    post:
      tags: [Invitaciones]
      summary: Confirmar nuevo correo de una cuenta activa
      description: >-
        Token de uso único enviado al correo nuevo; no cambia el correo
        de inicio de sesión hasta confirmarlo y registrar auditoría.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string, minLength: 1 }
      responses:
        '200':
          description: Correo verificado y actualizado; sesiones previas revocadas.
          content:
            application/json:
              schema:
                type: object
                required: [verified]
                properties:
                  verified: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: Token vencido, consumido o invalidado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/accounts/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Cuentas]
      summary: Confirmar inactivación y revocar acceso vigente
      description: La UI solicita confirmación; el servidor recibe confirm=true. No puede inactivarse al último ADMIN activo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmAction' }
      responses:
        '200':
          description: Cuenta INACTIVA; sesiones anteriores no sirven.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/accounts/{id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    post:
      tags: [Cuentas]
      summary: Reactivar cuenta con credenciales aún vigentes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmAction' }
      responses:
        '200':
          description: Cuenta ACTIVA; requiere nuevo inicio de sesión.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/accounts/{id}/audit:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      tags: [Cuentas]
      summary: Consultar historial de gestión autorizado
      responses:
        '200':
          description: Eventos sin contraseñas, tokens ni hashes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/account-invitations/accept:
    post:
      tags: [Invitaciones]
      summary: Aceptar invitación válida y establecer contraseña
      description: Rechaza invitaciones con siete días cumplidos y contraseñas sin ocho caracteres, mayúscula, minúscula o número.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 1 }
                password:
                  type: string
                  minLength: 8
                  description: Debe incluir al menos una letra mayúscula, una minúscula y un número; se valida en el servidor.
                  writeOnly: true
      responses:
        '200':
          description: Cuenta ACTIVA; no se inicia sesión implícitamente.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ACTIVA }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410':
          description: Invitación vencida, consumida o invalidada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Nombre efectivo depende de Better Auth y su configuración.
    sessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
      description: Token opaco del plugin Bearer; NO es JWT del plugin JWT.
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    RequestId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
  schemas:
    Role:
      type: string
      enum: [ADMIN, TEACHER]
    AccountStatus:
      type: string
      enum: [PENDIENTE, ACTIVA, INACTIVA]
    CreateAccount:
      type: object
      required: [name, email, role]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        email:
          type: string
          format: email
          pattern: '^[^@\s]+@(?:[A-Za-z0-9-]+\.)+[eE][dD][uU]\.[cC][oO]$'
        role: { type: string, const: TEACHER }
    Account:
      type: object
      required: [id, name, email, role, status, createdAt]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        pendingEmail: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        createdAt: { type: string, format: date-time }
        deliveryStatus:
          type: string
          enum: [PENDIENTE, ENVIADA, ERROR]
        invitationExpiresAt: { type: string, format: date-time }
    AdminRoleRequest:
      type: object
      required: [id, requesterAccountId, status, requestedAt]
      properties:
        id: { type: string }
        requesterAccountId: { type: string }
        status: { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA] }
        requestedAt: { type: string, format: date-time }
        decidedByAccountId: { type: string }
        decidedAt: { type: string, format: date-time }
    ConfirmAction:
      type: object
      required: [confirm]
      additionalProperties: false
      properties:
        confirm: { type: boolean, const: true }
    AuditEvent:
      type: object
      required: [actorId, targetId, action, occurredAt]
      properties:
        actorId: { type: string }
        targetId: { type: string }
        action: { type: string }
        occurredAt: { type: string, format: date-time }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    BadRequest:
      description: Validación incorrecta, incluida confirmación ausente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: Falta sesión vigente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Rol/estado actual impide la acción; sin exposición de cuentas.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Cuenta inexistente o no visible para el actor.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Correo ocupado, estado previo incompatible o carrera concurrente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: Operación no confirmada; error de almacenamiento/servicio.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
