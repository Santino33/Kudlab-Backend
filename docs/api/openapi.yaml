    post:
      operationId: claimAccessCode
      summary: Canjear código sin sesión docente
      tags:
        - Accesos
      description: Canje público online sin cookies ni Authorization docente. Código
        individual de cinco caracteres; claimId/secreto de 256 bits persistidos
        antes de enviar. ACCESS_UNAVAILABLE neutraliza autorización/estado; 429
        con Retry-After y 503 separan abuso e indisponibilidad. PostgreSQL
        comparte límites IP y digest entre instancias. Recuperación fija
        sesión/submission, nunca inicia ni devuelve evidencia. Sobres y fórmulas
        sin cambios. Participación institucional ausente bloquea uso real. Véase
        docs/acceso-codigo.md.
