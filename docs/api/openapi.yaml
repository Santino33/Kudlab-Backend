  responses:
    GroupResult:
      description: Curso confirmado; sin datos de estudiantes.
      content: { application/json: { schema: { $ref: '#/components/schemas/Group' } } }
    GroupConflict:
      description: Responsable no elegible, transferencia sin confirmar o curso con
        estudiantes/referencias que impiden borrado.
      content: { application/json: { schema: { $ref: '#/components/schemas/AcademicError' } } }
    AccountResult:
      description: Representación actual de cuenta.
      content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
    AccountCreated:
      description: Cuenta pendiente e invitación persistidas; no credenciales de sesión.
      content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
    RoleResult:
      description: Solicitud creada/decidida según operación.
      content: { application/json: { schema: { $ref: '#/components/schemas/RoleRequest' } } }
    StudentResult:
      description: Registro propio, solo seis campos públicos; no cuenta estudiantil.
      content: { application/json: { schema: { $ref: '#/components/schemas/Student' } } }
    BadInput:
      description: 400 INVALID_INPUT; JSON/validación de entrada inválida. fields
        opcional solo cuando aplica.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/UserError' },
              example: { code: INVALID_INPUT, message: Solicitud inválida }
            }
        }
    InvalidCredentials:
      description: 401 INVALID_CREDENTIALS uniforme para contraseña/cuenta no utilizable.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/UserError' },
              example: { code: INVALID_CREDENTIALS, message: Credenciales inválidas }
            }
        }
    Unauthenticated:
      description: 401 UNAUTHENTICATED; sesión persistida ausente/vencida/revocada o
        actividad expirada.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/UserError' },
              example: { code: UNAUTHENTICATED, message: Sesión requerida }
            }
        }
    Forbidden:
      description: 403 FORBIDDEN; cuenta/identidad no habilitada o rol no permitido.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/UserError' },
              example: { code: FORBIDDEN, message: Acceso denegado }
            }
        }
    NotFound:
      description: 404 NOT_FOUND; cuenta/solicitud no encontrada o UUID de ruta
        inválido según mapper.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/UserError' },
              example: { code: NOT_FOUND, message: Recurso no encontrado }
            }
        }
    Conflict:
      description: >-
        409: CONFLICT (duplicado/reserva/estado no modificable/solicitud
        decidida/identidad desincronizada), LAST_ADMIN al retirar último ADMIN
        activo, ACCOUNT_CONFLICT al aceptar invitación si la cuenta no puede
        activarse. Solo condiciones aplicables a operación.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/UserError' },
              example: { code: CONFLICT, message: El recurso ya existe }
            }
        }
    InvitationExpired:
      description: 410 INVITATION_EXPIRED; invitación vencida/usada/invalidada/no canjeable.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/UserError' },
              example: { code: INVITATION_EXPIRED, message: Invitación inválida o vencida }
            }
        }
    EmailExpired:
      description: 410 TOKEN_EXPIRED; confirmación vencida/usada/invalidada/no canjeable.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/UserError' },
              example: { code: TOKEN_EXPIRED, message: Verificación inválida o vencida }
            }
        }
    Expired:
      description: 410 VERIFICATION_EXPIRED; recuperación vencida/usada/invalidada/no
        canjeable.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/UserError' },
              example: { code: VERIFICATION_EXPIRED, message: Verificación inválida o vencida }
            }
        }
    Unavailable:
      description: >-
        503 UNAVAILABLE ante fallo técnico verificable; operaciones de correo
        también DELIVERY_FAILED o DELIVERY_STATUS_UNKNOWN. No garantiza rollback
        de efectos ya persistidos ni que el correo no se haya entregado;
        reconciliar consultando estado.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/UserError' },
              example: { code: UNAVAILABLE, message: Operación no confirmada }
            }
        }
    AcademicBadInput:
      description: 400 INVALID_INPUT; cuerpo/consulta no permitida o campos inválidos,
        tras guarda y ámbito cuando corresponda.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/AcademicError' },
              example:
                {
                  code: INVALID_INPUT,
                  message: Datos inválidos,
                  fields: { firstName: required }
                }
            }
        }
    AcademicUnauthenticated:
      description: 401 UNAUTHENTICATED; sesión no utilizable.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/AcademicError' },
              example: { code: UNAUTHENTICATED, message: Sesión requerida }
            }
        }
    AcademicForbidden:
      description: 403 FORBIDDEN; cuenta/identidad no activa o rol distinto de TEACHER
        (incluido ADMIN).
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/AcademicError' },
              example: { code: FORBIDDEN, message: Acceso denegado }
            }
        }
    AcademicNotFound:
      description: 404 NOT_FOUND indistinguible para ID malformado/ajeno/ausente y
        grupo ajeno/ausente.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/AcademicError' },
              example: { code: NOT_FOUND, message: Recurso no encontrado }
            }
        }
    AcademicConflict:
      description: 409 CONFLICT por código global ya ocupado, incluido inactivo; no
        revela titular.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/AcademicError' },
              example: { code: CONFLICT, message: Código de estudiante no disponible }
            }
        }
    AcademicUnavailable:
      description: 503 UNAVAILABLE; fallo de verificación/persistencia, sin prometer
        acceso ni confirmar operación. Un fallo de red posterior a commit
        requiere reconciliar.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/AcademicError' },
              example: { code: UNAVAILABLE, message: Servicio no disponible }
            }
        }
    ProviderForbidden:
      description: 403 del proveedor por origen/CSRF, p.ej. INVALID_ORIGIN o
        MISSING_OR_NULL_ORIGIN.
      content:
        {
          application/json:
            {
              schema: { $ref: '#/components/schemas/ProviderError' },
              example: { code: INVALID_ORIGIN, message: Invalid origin }
            }
        }
    RateLimit:
      description: 429 solo cuando rate limiter Better Auth está habilitado (por
        defecto en producción); no normalizado por el envoltorio delegado.
      headers:
        X-Retry-After:
          {
            description: Segundos indicados por proveedor antes de reintentar.,
            schema: { type: string, examples: [ '60' ] }
          }
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  required: [ message ],
                  properties:
                    {
                      message:
                        {
                          type: string,
                          description: Mensaje de límite.,
                          examples: [ 'Too many requests. Please try again later.' ]
                        }
                    }
                }
            }
        }
    ProviderFailure:
      description: Fallo delegado del proveedor no normalizado; no garantizar 503
        español ni cabeceras no-store no implementadas.
      content:
        application/json: { schema: { $ref: '#/components/schemas/ProviderError' } }
        text/plain:
          {
            schema:
              {
                type: string,
                description: Error textual delegado.,
                examples: [ Internal Server Error ]
              }
          }
