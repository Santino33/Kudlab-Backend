                    anyOf:
                      - type: string
                        enum:
                          - mouse
                          - touch
                          - pen
                      - type: "null"
                  geometry:
                    type: object
                    properties:
                      lane:
                        type: integer
                        minimum: 1
                        maximum: 6
                      x:
                        type: number
                      size:
                        type: number
                        minimum: 75
                        maximum: 105
                    required:
                      - lane
                      - x
                      - size
                    additionalProperties: false
                  calculationDecision: {}
                required:
                  - trial
                  - stimulus
                  - spawnedAtMs
                  - presentedAtMs
                  - respondedAtMs
                  - closedAtMs
                  - result
                  - segment
                  - closureReason
                  - responseWindowCompleted
                  - responseDevice
                  - geometry
                  - calculationDecision
                additionalProperties: false
              - type: object
                properties:
