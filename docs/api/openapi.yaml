openapi: 3.1.0
info:
  title: Kudlab — API implementada
  version: 0.1.0
  description: >-
    Catálogo contrastado con src/app.ts y sus routers. Usuarios del personal y
    cinco operaciones sobre registros de estudiantes realizadas por profesores
    TEACHER en su ámbito propio. Los estudiantes no acceden ni tienen cuentas
    aquí. Incluye catálogo, asignación supervisada, API restringida de juegos y
    consulta individual. Incluye cursos (grupos) gestionados por ADMIN y
    consulta propia por TEACHER. No incluye consentimiento, registro público ni
    Google. Los contratos históricos propuestos no acreditan disponibilidad.
    Todos los ejemplos son ficticios/no operativos: no enviar correo a sus
    direcciones ni utilizar sus contraseñas o marcadores como credenciales
    reales. Sesión persistida por cookie o Bearer opaco; JWT emitido para
    interoperabilidad NO sustituye sesión. Inactividad local máxima 30 minutos,
    aun con rememberMe. Esta versión documenta código, no certifica despliegue
    productivo.
servers:
  - url: /
tags:
  - name: Acceso
    description: Acceso del personal; únicamente lista blanca Better Auth.
  - name: Cuentas
    description: Gestión por ADMIN activo.
  - name: Invitaciones
    description: Activación mediante token de un uso.
  - name: CambiosCorreo
    description: Confirmación de correo nuevo.
  - name: SolicitudesRol
    description: Ascenso solicitado por TEACHER y decidido por ADMIN.
  - name: Recuperacion
    description: Recuperación neutra y confirmación sin login automático.
  - name: Estudiantes
    description: Registros gestionados por TEACHER en grupos propios; ADMIN no tiene
      acceso implícito.
  - name: Tareas
    description: Consulta del catálogo por TEACHER y ADMIN activos; no ejecución ni
      asignación.
  - name: Cursos
    description: Grupos existentes; CRUD ADMIN y consulta propia TEACHER.
  - name: Actividades
    description: Asignación supervisada y consulta individual TEACHER.
  - name: Runtime
    description: API restringida del juego, sin cuentas estudiantiles.
  - name: Accesos
    description: Códigos individuales de cinco caracteres; canje público sin cookies
      docentes. Uso real bloqueado.
paths:
  /api/auth/sign-in/email:
    post:
      operationId: signInEmail
      summary: Iniciar sesión del personal
      tags: [ Acceso ]
      security: []
      description: >-
        JSON estricto; requiere identidad y cuenta ACTIVA concordantes.
        Credenciales erróneas, inexistentes, pendientes o inactivas producen el
        mismo 401. rememberMe omitido equivale a true: cookie persistente
        Max-Age=1800. false omite Max-Age y crea dont_remember; el proveedor
        puede crear sesión interna de 86400s, sin eliminar el control local de
        30min de inactividad. La respuesta conserva cabeceras del proveedor, no
        devuelve JWT como sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ email, password ]
              properties:
                email:
                  {
                    type: string,
                    format: email,
                    description: Correo de la identidad existente.,
                    examples: [ docente@ejemplo.edu.co ]
                  }
                password:
                  {
                    type: string,
                    minLength: 1,
                    description: Contraseña existente; el parser de login solo exige no vacío.,
                    examples: [ DemoFicticia123 ]
                  }
                rememberMe:
                  {
                    type: boolean,
                    default: true,
                    description: Persistencia de cookie; no evita expiración por inactividad.,
                    examples: [ false ]
                  }
      responses:
        '200':
          description: Identidad filtrada y credencial de sesión persistida.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
            set-auth-token: { $ref: '#/components/headers/SessionToken' }
          content:
            application/json:
              schema:
                {
                  type: object,
                  required: [ user ],
                  properties: { user: { $ref: '#/components/schemas/Identity' } }
                }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/InvalidCredentials' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/auth/get-session:
    get:
      operationId: getSession
      summary: Consultar sesión propia
      description: >-
        Revalida identidad/cuenta y actividad. Tras validar, propaga por
        separado las Set-Cookie de renovación del proveedor, sin reenviar
        set-auth-jwt ni set-auth-token. No renueva actividad protegida ni reabre
        sesiones que alcanzaron 30 minutos de inactividad. La preparación de las
        rutas protegidas usa la misma propagación; una denegación posterior no
        registra actividad aceptada.
      tags: [ Acceso ]
      security: &session [ { sessionCookie: [] }, { secureSessionCookie: [] }, { sessionBearer: [] } ]
      responses:
        '200':
          description: Sesión propia vigente, sin credencial opaca.
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionView' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/auth/sign-out:
    post:
      operationId: signOut
      summary: Cerrar la sesión presentada
      description: >-
        Sin cuerpo requerido; el adaptador ignora cualquier cuerpo recibido y
        pasa {} al proveedor. No admite opciones de callback o redirección.
        Invalida solo sesión presentada y expira cookies. Con cookie se aplican
        controles de origen/CSRF del proveedor; respetar trustedOrigins. Solo
        después de que el proveedor acepte, el adaptador confirma la eliminación
        persistida por id de sesión e identidad antes de reenviar éxito y
        cookies expiradas. Si no puede confirmar esa revocación, devuelve 503
        sin cookies de cierre; algún efecto previo puede haber ocurrido. No se
        restauran sesiones cerradas.
      tags: [ Acceso ]
      security: *session
      responses:
        '200':
          description: Revocación persistida confirmada de la sesión presentada; descartar
            la credencial local.
          headers:
            Set-Cookie:
              description: Una o varias cookies expiradas (session_token/dont_remember y
                auxiliares); Max-Age=0. No nueva credencial.
              schema:
                {
                  type: string,
                  examples:
                    [
                      'better-auth.session_token=; Max-Age=0; Path=/;
                        HttpOnly; SameSite=Lax'
                    ]
                }
          content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/ProviderForbidden' }
        '429': { $ref: '#/components/responses/RateLimit' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/ProviderFailure' }
  /api/auth/jwks:
    get:
      operationId: getJwks
      summary: Consultar claves públicas de verificación
      description: >-
        Público, delegado a Better Auth 1.7.7. Publica solo claves públicas.
        EdDSA/Ed25519 por defecto; no exigir campos RSA. Puede generar/persistir
        claves cuando no existen: no implica ausencia de acceso a BD.
      tags: [ Acceso ]
      security: []
      responses:
        '200':
          description: Conjunto de claves públicas.
          content: { application/json: { schema: { $ref: '#/components/schemas/Jwks' } } }
        '429': { $ref: '#/components/responses/RateLimit' }
        default: { $ref: '#/components/responses/ProviderFailure' }
  /api/auth/token:
    get:
      operationId: issueInteropToken
      summary: Emitir JWT de interoperabilidad
      description: >-
        Exige sesión persistida, cuenta activa e inactividad válida antes de
        delegar. No renueva actividad protegida. JWT por defecto 15min, EdDSA,
        iss/aud=baseURL, sub=ID identidad. Payload de usuario del proveedor, no
        prometer DTO filtrado del login. Este JWT aislado no supera guardas de
        negocio. Puede devolver UNAUTHORIZED delegado si la sesión deja de valer
        entre precontrol y emisión.
      tags: [ Acceso ]
      security: *session
      responses:
        '200':
          description: JWT firmado, no credencial de sesión.
          content:
            application/json:
              schema:
                type: object
                required: [ token ]
                properties:
                  token:
                    {
                      type: string,
                      description: JWT firmado; marcador ficticio no canjeable en este ejemplo.,
                      examples: [ JWT_FICTICIO_NO_UTILIZABLE ]
                    }
        '401':
          description: Precontrol UNAUTHENTICATED o proveedor UNAUTHORIZED; sesión inválida.
          content: { application/json: { schema: { $ref: '#/components/schemas/UserError' } } }
        '429': { $ref: '#/components/responses/RateLimit' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/ProviderFailure' }
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: Listar cuentas del personal
      description: Solo ADMIN activo. Orden descendente por creación e ID; estado de
        última invitación cuando existe.
      tags: [ Cuentas ]
      security: *session
      parameters:
        - {
            name: limit,
            in: query,
            description: Tamaño de página.,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20, examples: [ 20 ] }
          }
        - {
            name: offset,
            in: query,
            description: Desplazamiento desde cero.,
            schema: { type: integer, minimum: 0, default: 0, examples: [ 0 ] }
          }
        - {
            name: status,
            in: query,
            description: Estado exacto opcional.,
            schema: { $ref: '#/components/schemas/AccountStatus' }
          }
      responses:
        '200':
          description: Página de cuentas.
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountPage' } } }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: createAccount
      summary: Crear cuenta pendiente TEACHER
      description: >-
        ADMIN activo crea cuenta PENDIENTE y emite invitación de 7 días, no
        contraseña administrativa. El bootstrap del primer ADMIN no es endpoint.
        SMTP puede fallar después de persistir la cuenta;503 no garantiza
        rollback. deliveryStatus ENVIADA solo después de confirmar proveedor.
      tags: [ Cuentas ]
      security: *session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ name, email, role ]
              properties:
                name: { $ref: '#/components/schemas/Name' }
                email: { $ref: '#/components/schemas/InstitutionalEmail' }
                role:
                  {
                    type: string,
                    const: TEACHER,
                    description: Único rol permitido en alta ordinaria.,
                    examples: [ TEACHER ]
                  }
      responses:
        '201': { $ref: '#/components/responses/AccountCreated' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/accounts/{id}:
    parameters: [ { $ref: '#/components/parameters/AccountId' } ]
    get:
      operationId: getAccount
      summary: Consultar cuenta
      description: ADMIN activo; ID de cuenta de negocio, distinto de identidad Better Auth.
      tags: [ Cuentas ]
      security: *session
      responses:
        '200': { $ref: '#/components/responses/AccountResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
    patch:
      operationId: updateAccount
      summary: Editar nombre o correo de cuenta
      description: >-
        ADMIN activo. JSON estricto con al menos nombre o correo. No cambia
        rol/estado. Cuenta pendiente puede recibir invitación nueva al reenviar
        correo, invalidando anterior. Cuenta activa reserva pendingEmail hasta
        confirmación del titular (7d). Cambios pueden persistir antes de fallo
        SMTP; no prometer rollback por 503.
      tags: [ Cuentas ]
      security: *session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { $ref: '#/components/schemas/Name' }
                email: { $ref: '#/components/schemas/InstitutionalEmail' }
      responses:
        '200': { $ref: '#/components/responses/AccountResult' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/accounts/{id}/audit:
    parameters: [ { $ref: '#/components/parameters/AccountId' } ]
    get:
      operationId: listAccountAudit
      summary: Consultar auditoría de cuenta
      description: ADMIN activo; comprueba existencia antes de listar. Array ordenado
        por fecha ascendente, sin paginación ni envoltorio.
      tags: [ Cuentas ]
      security: *session
      responses:
        '200':
          description: Eventos de la cuenta, sin secretos ni credenciales.
          content:
            {
              application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } }
            }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/accounts/{id}/role:
    parameters: [ { $ref: '#/components/parameters/AccountId' } ]
    put:
      operationId: demoteAccount
      summary: Descender ADMIN a TEACHER
      description: ADMIN activo; destino debe ser ADMIN activo con identidad.409
        LAST_ADMIN si es último administrador activo. Ascenso no disponible
        mediante este PUT.
      tags: [ Cuentas ]
      security: *session
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [ role ],
                    properties:
                      {
                        role:
                          {
                            type: string,
                            const: TEACHER,
                            description: Rol de destino.,
                            examples: [ TEACHER ]
                          }
                      }
                  }
              }
          }
      responses:
        '200': { $ref: '#/components/responses/AccountResult' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/accounts/{id}/deactivate:
    parameters: [ { $ref: '#/components/parameters/AccountId' } ]
    post:
      operationId: deactivateAccount
      summary: Inactivar cuenta activa
      description: ADMIN activo; exige confirmación. Revoca sesiones y conserva
        historial.409 LAST_ADMIN si no quedaría otro ADMIN activo; estado no
        modificable también409.
      tags: [ Cuentas ]
      security: *session
      requestBody: { $ref: '#/components/requestBodies/Confirmation' }
      responses:
        '200': { $ref: '#/components/responses/AccountResult' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/accounts/{id}/reactivate:
    parameters: [ { $ref: '#/components/parameters/AccountId' } ]
    post:
      operationId: reactivateAccount
      summary: Reactivar cuenta inactiva
      description: ADMIN activo; exige confirmación. No restaura sesiones previas; es
        necesario iniciar sesión nuevamente.409 si estado no es INACTIVA o
        identidad no permite transición.
      tags: [ Cuentas ]
      security: *session
      requestBody: { $ref: '#/components/requestBodies/Confirmation' }
      responses:
        '200': { $ref: '#/components/responses/AccountResult' }
        '400': { $ref: '#/components/responses/BadInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/account-invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Aceptar invitación y fijar contraseña
      description: Sin sesión. Token7d de un uso, vinculado a correo/cuenta PENDIENTE
        TEACHER; no es credencial de sesión.409 ACCOUNT_CONFLICT si no puede
        activarse;410 INVITATION_EXPIRED si no canjeable.
      tags: [ Invitaciones ]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ token, password ]
              properties:
                token: { $ref: '#/components/schemas/VerificationToken' }
                password: { $ref: '#/components/schemas/NewPassword' }
      responses:
        '200':
          description: Cuenta activada; no entrega credenciales de sesión.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [ status ],
                      properties:
                        {
                          status:
                            {
                              type: string,
                              const: ACTIVA,
                              description: Estado resultante.,
                              examples: [ ACTIVA ]
                            }
                        }
                    }
                }
            }
        '400': { $ref: '#/components/responses/BadInput' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/InvitationExpired' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/account-email-changes/confirm:
    post:
      operationId: confirmEmailChange
      summary: Confirmar correo nuevo
      description: Sin sesión. Token7d de un uso verifica acceso al correo, no
        identidad del llamador HTTP. Consume token, confirma nuevo correo y
        revoca sesiones.410 TOKEN_EXPIRED o409 si no verificable.
      tags: [ CambiosCorreo ]
      security: []
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [ token ],
                    properties: { token: { $ref: '#/components/schemas/VerificationToken' } }
                  }
              }
          }
      responses:
        '200':
          description: Correo confirmado y sesiones anteriores revocadas.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [ verified ],
                      properties:
                        {
                          verified:
                            {
                              type: boolean,
                              const: true,
                              description: Confirmación completada.,
                              examples: [ true ]
                            }
                        }
                    }
                }
            }
        '400': { $ref: '#/components/responses/BadInput' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/EmailExpired' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin-role-requests:
    get:
      operationId: listRoleRequests
      summary: Listar solicitudes de ascenso visibles
      description: Sesión activa. ADMIN ve pendientes; TEACHER ve únicamente propias.
        Orden solicitado descendente, sin parámetros de paginación
        implementados.
      tags: [ SolicitudesRol ]
      security: *session
      responses:
        '200':
          description: Array sin envoltorio de solicitudes visibles.
          content:
            {
              application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoleRequest' } } }
            }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      operationId: submitRoleRequest
      summary: Solicitar ascenso a ADMIN
      description: Solo TEACHER activo; el router no consume cuerpo. Identidad del
        solicitante sale de sesión, no del cliente.409 si ya tiene solicitud
        pendiente.
      tags: [ SolicitudesRol ]
      security: *session
      responses:
        '201': { $ref: '#/components/responses/RoleResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin-role-requests/{id}/approve:
    parameters: [ { $ref: '#/components/parameters/RequestId' } ]
    post:
      operationId: approveRoleRequest
      summary: Aprobar solicitud de ascenso
      description: ADMIN activo, sin auto-decisión; solicitante TEACHER activo
        elegible. No consume cuerpo. Cambia rol y audita;409 si decidida, no
        elegible o identidad desincronizada.
      tags: [ SolicitudesRol ]
      security: *session
      responses:
        '200': { $ref: '#/components/responses/RoleResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/admin-role-requests/{id}/reject:
    parameters: [ { $ref: '#/components/parameters/RequestId' } ]
    post:
      operationId: rejectRoleRequest
      summary: Rechazar solicitud de ascenso
      description: ADMIN activo, sin auto-decisión y con solicitante elegible
        actualmente. No consume cuerpo. Mantiene rol del solicitante;409 si ya
        decidida o no elegible.
      tags: [ SolicitudesRol ]
      security: *session
      responses:
        '200': { $ref: '#/components/responses/RoleResult' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/v1/auth/password-recovery/request:
    post:
      operationId: requestPasswordRecovery
      summary: Solicitar recuperación de contraseña
      description: >-
        Pública. Correo institucional válido;202 neutro para cuenta inexistente,
        pendiente, inactiva o activa. Solo cuenta activa concordante obtiene
        token30min; solicitud nueva invalida anteriores. Fallo SMTP no revela
        existencia ni garantiza entrega.
      tags: [ Recuperacion ]
      security: []
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    additionalProperties: false,
                    required: [ email ],
                    properties: { email: { $ref: '#/components/schemas/InstitutionalEmail' } }
                  }
              }
          }
      responses:
        '202':
          description: Confirmación neutra, no confirmación de envío.
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [ message ],
                      properties:
                        {
                          message:
                            {
                              type: string,
                              const: 'Si corresponde, recibirás instrucciones en tu correo.',
