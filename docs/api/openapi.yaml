components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Cookie HttpOnly de sesión persistida con baseURL HTTP local. No
        JWT. SameSite=Lax y Path=/; navegador no puede fijar libremente Cookie.
    secureSessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-better-auth.session_token
      description: Variante de cookie con baseURL HTTPS configurado;
        Secure/HttpOnly/SameSite=Lax. Alternativa a HTTP o Bearer, no exigir las
        tres.
    sessionBearer:
      type: http
      scheme: bearer
      description: Credencial OPACA de sesión Better Auth persistida, obtenida en
        set-auth-token. No usar el JWT de interoperabilidad.
    runtimeCapability:
      type: http
      scheme: bearer
      description: Secreto de runtime limitado a una sesión. Nunca sesión docente ni JWT.
  parameters:
    GroupId:
      {
        name: id,
        in: path,
        required: true,
        description: UUID de curso; malformado/ajeno/ausente404.,
        schema: { type: string, format: uuid }
      }
    AccountId:
      {
        name: id,
        in: path,
        required: true,
        description: UUID de cuenta de negocio; inválido o ausente404.,
        schema:
          {
            type: string,
            format: uuid,
            examples: [ 00000000-0000-4000-8000-000000000001 ]
          }
      }
    RequestId:
      {
        name: id,
        in: path,
        required: true,
        description: UUID de solicitud; inválido o ausente404.,
        schema:
          {
            type: string,
            format: uuid,
            examples: [ 00000000-0000-4000-8000-000000000003 ]
          }
      }
    StudentId:
      {
        name: id,
        in: path,
        required: true,
        description: UUID de estudiante propio; malformado/ajeno/ausente produce mismo404.,
        schema:
          {
            type: string,
            format: uuid,
            examples: [ 00000000-0000-4000-8000-000000000004 ]
          }
      }
  headers:
    SessionCookie:
      description: Cookie HttpOnly/SameSite=Lax/Path=/; variante __Secure- cuando
        baseURL HTTPS. Puede emitir dont_remember; no cookie cache habilitada.
      schema:
        {
          type: string,
          examples:
            [
              'better-auth.session_token=SESION_FICTICIA; Path=/; HttpOnly;
                SameSite=Lax'
            ]
        }
    SessionToken:
      description: Credencial opaca de sesión para clientes Bearer; no JWT. Expuesta
        por CORS actual cuando corresponde.
      schema: { type: string, examples: [ SESION_FICTICIA_NO_UTILIZABLE ] }
  requestBodies:
    Confirmation:
      required: true
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [ confirm ],
                  properties:
                    {
                      confirm:
                        {
                          type: boolean,
                          const: true,
                          description: Confirmación explícita de transición.,
                          examples: [ true ]
                        }
                    }
                }
            }
        }
  schemas:
    GroupInput:
      type: object
      additionalProperties: false
      required: [ name, grade, schoolYear, teacherId ]
      properties:
        name:
          {
            type: string,
            minLength: 1,
            maxLength: 50,
            description: Recortado y sin NUL.
          }
        grade:
          {
            type: string,
            minLength: 1,
            maxLength: 20,
            description: Recortado y sin NUL.
          }
        schoolYear:
          {
            type: integer,
            minimum: -2147483648,
            maximum: 2147483647,
            description: Entero PostgreSQL; no se fija rango institucional.
          }
        teacherId:
          {
            type: string,
            format: uuid,
            description: Cuenta de negocio TEACHER activa elegible.
          }
    GroupPatch:
      type: object
      additionalProperties: false
      anyOf:
        [
          { required: [ name ] },
          { required: [ grade ] },
          { required: [ schoolYear ] },
          { required: [ teacherId ] }
        ]
      properties:
        name: { $ref: '#/components/schemas/GroupInput/properties/name' }
        grade: { $ref: '#/components/schemas/GroupInput/properties/grade' }
        schoolYear: { $ref: '#/components/schemas/GroupInput/properties/schoolYear' }
        teacherId: { $ref: '#/components/schemas/GroupInput/properties/teacherId' }
        confirmTransfer:
          {
            type: boolean,
            const: true,
            description: Obligatorio cuando cambia el responsable.
          }
    Group:
      type: object
      additionalProperties: false
      required: [ id, name, grade, schoolYear, teacherId, teacherName ]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: '#/components/schemas/GroupInput/properties/name' }
        grade: { $ref: '#/components/schemas/GroupInput/properties/grade' }
        schoolYear: { $ref: '#/components/schemas/GroupInput/properties/schoolYear' }
        teacherId: { type: string, format: uuid }
        teacherName: { type: string, minLength: 1 }
    TaskSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          title,
          description,
          isEnabled,
          integrationReady,
          publishedVersion,
          assignable,
          unavailableReasons,
          revision
        ]
      properties:
        id: { type: string, pattern: '^TG-[0-9]{2}$', examples: [ TG-01 ] }
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        isEnabled: { type: boolean }
        integrationReady: { type: boolean }
        publishedVersion:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [ id, version ]
              properties:
                id: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
        assignable:
          {
            type: boolean,
            description: Calculado en servidor; requiere habilitación,
            integración comprobada y versión publicada.
          }
        unavailableReasons:
          type: array
          uniqueItems: true
          items:
            {
              type: string,
              enum:
                [
                  INTEGRATION_PENDING,
                  CONFIGURATION_UNPUBLISHED,
                  TASK_DISABLED,
                  CONFIGURATION_UNSUPPORTED,
                  METHODOLOGY_PENDING
                ]
            }
        revision: { type: integer, minimum: 1 }
    TaskDetail:
      type: object
      additionalProperties: false
      required:
        [
          id,
          title,
          description,
          isEnabled,
          integrationReady,
          publishedVersion,
          assignable,
          unavailableReasons,
          revision,
          purpose,
          pedagogicalNotice
        ]
      properties:
        id: { $ref: '#/components/schemas/TaskSummary/properties/id' }
        title: { $ref: '#/components/schemas/TaskSummary/properties/title' }
        description: { $ref: '#/components/schemas/TaskSummary/properties/description' }
        isEnabled: { $ref: '#/components/schemas/TaskSummary/properties/isEnabled' }
        integrationReady: { $ref: '#/components/schemas/TaskSummary/properties/integrationReady' }
        publishedVersion: { $ref: '#/components/schemas/TaskSummary/properties/publishedVersion' }
        assignable: { $ref: '#/components/schemas/TaskSummary/properties/assignable' }
        unavailableReasons: { $ref: '#/components/schemas/TaskSummary/properties/unavailableReasons' }
        revision: { $ref: '#/components/schemas/TaskSummary/properties/revision' }
        purpose: { type: string, minLength: 1 }
        pedagogicalNotice: { type: string, minLength: 1 }
    Jwks:
      type: object
      required: [ keys ]
      properties:
        keys:
          type: array
          description: Claves públicas; ejemplo sintético no utilizable.
          items:
            type: object
            required: [ kid, kty, alg ]
            properties:
              kid:
                {
                  type: string,
                  description: Identificador de clave pública.,
                  examples: [ clave-ficticia-006 ]
                }
              kty: { type: string, description: Tipo JWK; OKP por defecto., examples: [ OKP ] }
              alg:
                {
                  type: string,
                  description: Algoritmo de firma; EdDSA por defecto.,
                  examples: [ EdDSA ]
                }
              crv: { type: string, description: Curva cuando procede., examples: [ Ed25519 ] }
              x:
                {
                  type: string,
                  description: Coordenada pública codificada; no material privado.,
                  examples: [ AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA ]
                }
    Name:
