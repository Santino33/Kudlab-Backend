services:
  consent-validator:
    image: ${CONSENT_VALIDATOR_IMAGE:-kudlab-consent-validator:local}
    build:
      context: .
      dockerfile: Dockerfile.consent-validator
    network_mode: none
    read_only: true
    user: "1000:1000"
    environment:
      TMPDIR: /work
      TSX_DISABLE_CACHE: "1"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 64
    tmpfs:
      - /work:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=700
    volumes:
      - consent-validator-socket:/socket
volumes:
  consent-validator-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1m,uid=1000,gid=1000,mode=700
